name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: CI / check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test -- --run
      - name: Build
        run: pnpm run build
        env:
          # Build must not need a real DB; set a secret later if a page queries at build time.
          DATABASE_URL: ${{ secrets.DATABASE_URL_CI || 'postgres://user:pass@localhost:5432/ci' }}
